    function changeLanguage() {
        const lang = document.getElementById('langSelect').value;
        const data = translations[lang];

        document.documentElement.lang = lang;
        document.getElementById('mainTitle').innerText = data.title;
        document.getElementById('lastUpdate').innerText = data.update;
        document.getElementById('footerNote').innerHTML = data.footer;

        const content = document.getElementById('content');
        content.style.opacity = '0';
        content.style.transform = 'translateY(10px)';
        content.style.transition = 'opacity 0.2s, transform 0.2s';

        setTimeout(() => {
            let html = '';
            data.sections.forEach((sec, idx) => {
                html += `<section style="animation-delay:${0.05 + idx * 0.07}s">`;
                html += `<h2>${sec.h2}</h2><p>${sec.p}</p>`;
                if (sec.list) {
                    html += '<ul>' + sec.list.map(li => `<li>${li}</li>`).join('') + '</ul>';
                }
                if (sec.link) {
                    html += `<div class="external-link"><a href="https://ai.google.dev/terms" target="_blank" rel="noopener noreferrer">&#128279; ${sec.link}</a></div>`;
                }
                html += '</section>';
            });

            content.innerHTML = html;

            content.querySelectorAll('section').forEach(el => {
                el.style.animationName = 'none';
                requestAnimationFrame(() => requestAnimationFrame(() => {
                    el.style.animationName = '';
                }));
            });

            content.style.opacity = '1';
            content.style.transform = 'translateY(0)';
        }, 200);
    }

    // Detect browser language, default to English
    (function init() {
        const saved   = localStorage.getItem('pgpt-tos-lang');
        const browser = (navigator.language || '').slice(0, 2).toLowerCase();
        const langs   = ['en', 'it', 'es', 'pt', 'fr', 'de'];
        const lang    = saved && langs.includes(saved) ? saved
                      : langs.includes(browser) ? browser
                      : 'en';
        document.getElementById('langSelect').value = lang;
        changeLanguage();
    })();

    // Persist language choice
    document.getElementById('langSelect').addEventListener('change', () => {
        localStorage.setItem('pgpt-tos-lang', document.getElementById('langSelect').value);
    });
    </script>
